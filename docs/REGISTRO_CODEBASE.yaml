  pattern_ricorrenti:
    - descrizione: "Casi d'uso grandi divisi per area, con use-cases.ts che riesporta tutto (index.ts e test invariati): condominium (registry/budget/meeting/operations/read-use-cases + shared), deadlines (definitions, derived-sync, occurrences, reads, daily-cycle), maintenance (works, entries, warranties-plans, plants, reads + common)"
      dove: "app/src/modules/{condominium,deadlines,maintenance}/application/"
    - descrizione: "Email del giro giornaliero fuori transazione: runDailyCycle (in transazione, solo date e avvisi) poi sendDueEmails(db, actor, ...) con esito di ogni invio in una transazione breve; resendMail ha timeout di 10 s. lettings espone rentDues (id e scadenza dei canoni) per evitare di ricaricare il dettaglio"
      dove: "app/src/modules/deadlines/application/daily-cycle.ts, app/src/lib/daily-job.ts, app/src/modules/lettings/index.ts"
    - descrizione: "Promemoria affitti brevi: computeFindings segnala short_term_count quando almeno 2 immobili distinti hanno una locazione breve non terminata nell'anno (soglia di attenzione, non norma)"
      dove: "app/src/modules/attention/domain/findings.ts"
    - descrizione: "Dipendenze sui dati tra moduli: letture dirette di tabelle altrui (solo lettura, nessuna tabella e' scritta da due moduli) dichiarate in un elenco; una nuova lettura o una voce superata fanno fallire il test. Letture oggi: deadlines -> matters/registry/rules/auth; directory -> documents/competence; documents -> rules; dossier -> documents/lettings/registry/rules; offices -> audit/rules; rules -> documents/registry; backup -> audit"
      dove: "tests/architecture-data.test.ts"
    - descrizione: "Unita' di lavoro: ogni scrittura in una transazione con la riga di audit (atomiche)"
      dove: "src/platform/db/unit-of-work.ts"
    - descrizione: "requireOwner() in OGNI pagina/azione/route che tocca dati; layout e proxy sono solo ottimistici"
      dove: "src/platform/auth/owner.ts"
    - descrizione: "Singleton lazy su globalThis (db, auth): Next puo' istanziare i moduli piu' volte"
      dove: "src/platform/db/client.ts, src/platform/auth/auth.ts"
    - descrizione: "Regole normative come dati versionati con fonte e stato di verifica (PROPOSTO, non ancora implementato)"
      dove: "docs/Stage A - Proposta di architettura.md §5"
    - descrizione: "Confini architetturali applicati da dependency-cruiser + test che vieta nomi di territori nel codice"
      dove: "app/.dependency-cruiser.cjs, app/tests/architecture.test.ts"
    - descrizione: "e2e sulla build di produzione con PGlite via socket; un IP (x-real-ip) diverso per flusso per non sommare i rate limit"
      dove: "app/e2e/, app/playwright.config.ts"
    - descrizione: "Chiavi di navigazione vincolate ai messaggi (un menu senza traduzione non compila)"
      dove: "app/src/app/(app)/_components/nav-items.ts"

    - descrizione: "Il motore possiede la derivazione di una voce, il proprietario possiede lo stato: la valutazione crea/aggiorna/segna 'da rivedere' ma non tocca mai stato, nota e documenti"
      dove: "src/modules/dossier/application/use-cases.ts (evaluateDossier)"
    - descrizione: "Confronto canonico (chiavi ordinate) per JSON letto da jsonb: Postgres riordina le chiavi"
      dove: "src/modules/rules/application/use-cases.ts, src/modules/dossier/application/use-cases.ts"
    - descrizione: "Chiavi dei messaggi con punti sono percorsi annidati in next-intl: i fatti delle regole sono annidati (facts.asset.kind), non chiavi piatte con il punto"
      dove: "messages/it.json (rules.facts)"
    - descrizione: "Controlli con stato locale che il server puo' cambiare (stato di una voce, nota) si rimontano con una key che include il valore del server"
      dove: "src/app/(app)/immobili/[id]/dossier/page.tsx"
    - descrizione: "Archivio: manifest con impronte di tabelle e file verificate in lettura; ripristino in transazione con trigger dell'audit spento solo li' e catena ricontrollata prima del commit"
      dove: "src/modules/backup/application/{archive,restore}.ts, infrastructure/postgres-snapshot.ts"
    - descrizione: "Una tabella nuova deve stare nell'archivio o in EXCLUDED_TABLES (con motivo): lo impone un test; le tabelle riempite da migrazioni vanno in SEEDED_TABLES"
      dove: "src/modules/backup/domain/archive.ts, tests/backup.test.ts"
    - descrizione: "Prima i byte nello storage, poi le righe nel database; se il database fallisce si rimuovono i byte (storage non transazionale)"
      dove: "src/modules/documents/application/use-cases.ts (storeAndRecord)"
    - descrizione: "Punto d'ingresso client (client.ts) con sole costanti e tipi: l'index del modulo non va nel bundle del browser se importa codice Node"
      dove: "src/modules/documents/client.ts"
    - descrizione: "Moduli con file: FormData verso una server action (non JSON); campi controllati nel client e file in un input non controllato"
      dove: "src/app/(app)/documenti/"
    - descrizione: "Scadenze collegate coerenti con i dati: si chiudono quando l'importo e' coperto o l'adempimento eseguito, si RIAPRONO se il dato viene corretto (pagamento tolto, canone ridotto, adempimento riaperto), si ARCHIVIANO quando la voce e' sostituita o tolta"
      dove: "modules/{taxes,lettings,condominium,maintenance,insurance}/index.ts (completeDeadline, reopenDeadline, archiveDeadline)"
    - descrizione: "Linguaggio neutro: nessuna schermata afferma conformita', non dovuto, validita' o avviabilita'. Verificato su tutti i messaggi, su tutte le stringhe del codice e sul testo reso di ogni schermata"
      dove: "tests/neutral-language.test.ts, e2e/neutral-language.spec.ts, tests/helpers/neutral.ts"
    - descrizione: "Controlli statici che fanno fallire la CI: chiavi dei messaggi esistenti, accessi (pagine/route/azioni), confine server-client (indici dei moduli non nel bundle del browser, vocabolario via client.ts)"
      dove: "tests/messages.test.ts, tests/authz.test.ts, tests/client-boundary.test.ts"
    - descrizione: "Importi in centesimi (interi), date di calendario come stringhe AAAA-MM-GG con aritmetica in UTC, millesimi interi x10000; l'audit registra azioni e identificativi, mai testi, importi o nomi"
      dove: "src/shared/{money,dates}.ts, tests/*.test.ts (ultimo test di ogni modulo)"
    - descrizione: "Elenchi grandi: paginazione (50 per pagina), conteggio con gli stessi filtri, titoli per identificativo e opzioni dei menu con letture leggere"
      dove: "src/modules/documents/, src/app/(app)/documenti/page.tsx, tests/documents-scale.test.ts"
    - descrizione: "Tipo di attivita' in corso come fatto del bene per le regole (letting.types); il dossier si riallinea dopo ogni cambiamento di locazione, nella stessa transazione"
      dove: "src/modules/rules/domain/condition.ts, src/modules/dossier/index.ts, src/app/(app)/locazioni/actions.ts"

    - descrizione: "Modulo di sola lettura che compone i dati di altri moduli tramite i loro index.ts (economy, attention, search): nessuno schema proprio, nessuna scrittura, nessuna riga di audit"
      dove: "src/modules/{economy,attention,search}/index.ts"
    - descrizione: "Route di file/dati per il browser: getOwnerForApi() (401 senza sessione), Cache-Control private no-store, X-Content-Type-Options nosniff; l'unica eccezione pubblica e' /api/health, vincolata da tests/authz.test.ts"
      dove: "src/app/api/{economia,calendario,documenti,tributi,esportazione,health}/route.ts"
    - descrizione: "CSV con iniezione di formule neutralizzata in un solo punto (shared/csv.ts); anche i CSV che partono per terzi"
      dove: "src/shared/csv.ts"

  file_temporanei: []   # nessun file [TEMPORANEO] presente nel progetto

  file_eliminati_ultima_sessione:
    - "itemAssetId in modules/dossier/index.ts, listAllAssetsForSharing in modules/sharing/index.ts, fixedClock in platform/clock/index.ts, CALC_TYPES in shared/calc.ts"  # mai usati (cercati uno per uno prima di toglierli)
