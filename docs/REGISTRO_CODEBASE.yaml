    - "31 chiavi di messaggio senza riferimento statico in messages/it.json"  # il test dei messaggi continua a passare
    - "csvCell duplicato in modules/taxes/domain/taxes.ts"  # sostituito da shared/csv.ts (E51)
    - "buildCsv con escape proprio in modules/sharing/domain/sharing.ts"  # ora csvDocument: chiude la gap sulle formule
    - "app/src/app/(app)/loading.tsx e il messaggio problems.loading"  # creati e tolti nella stessa sessione: trasformavano i 404 in 200 (E50)
    - "nessun file del progetto e' stato eliminato senza conferma; script di prova solo nella cartella di sessione, fuori dal repository"

  gitignore_pattern_aggiunti:
    - "node_modules/, .next/, out/, dist/, coverage/, *.tsbuildinfo, next-env.d.ts"
    - ".env, .env.*, !.env.example, .vercel/"
    - "*.log, *.tmp, *.bak, *.old, tmp_*, temp_*, debug_*"
    - "playwright-report/, test-results/, **/e2e/.auth/"
    - ".claude/settings.local.json, .claude/worktrees/"
    - "backups/, *.ndjson.enc"
    - ".pglite/ (database di sviluppo locale)"
    - "/.storage/ (file dei documenti in locale)"
    - "*.gibk, *.pem (archivi cifrati e chiavi private: mai nel repository)"

  todo_e_criticita:
    - "Node locale 25.2.0: dependency-cruiser non lo supporta (pnpm arch richiede Node 24). Installare Node 24."
    - "La CI (.github/workflows/ci.yml, con il lavoro e2e), il controllo settimanale delle dipendenze (security.yml) e Dependabot sono scritti ma mai eseguiti: non c'e' ancora un repository remoto."
    - "Nessun commit effettuato: repository git inizializzato ma vuoto."
    - "Test di concorrenza sull'audit validi solo su Postgres reale (CI); in locale girano su PGlite."
    - "Da verificare con l'account: x-real-ip su Vercel, passkey sul dominio di produzione, Blob privato (D3), limiti del cron."
    - "tsconfig include anche e2e/: un errore di tipo nei test blocca anche `next build`. Valutare un tsconfig separato."
    - "Lingua di commenti/doc tecnici: ora italiano, il prompt finale prevede inglese (DECISIONS.md, E9)."
    - "Apostrofi: messages/it.json usa ’ (tipografico) nelle sezioni auth e ' nelle altre. Uniformare."
    - "Giro giornaliero: scritto (runDailyJob, /api/cron/giornaliero, vercel.json) ma MAI provato su Vercel: serve l'account e CRON_SECRET."
    - "Regole: non c'e' una schermata per modificare le categorie del dossier (dati di partenza) ne' per creare scadenze come esito (incremento 5). Il contenuto delle regole di esempio e' illustrativo e va validato da un professionista."
    - "Regole: l'editor non rappresenta condizioni annidate (si mostrano in sola lettura); i fatti disponibili non includono ancora locazione/ricettivita'/condominio come entita' (arrivano con gli incrementi 7 e 10: per ora si usano le caratteristiche tecniche)."
    - "Stampa del dossier: le spiegazioni 'Perche' compare?' si stampano solo se aperte; la stampa nasconde menu e barra ma non e' stata rifinita (intestazioni, interruzioni di pagina)."
    - "Backup: manca il secondo fornitore (la destinazione e' una cartella su disco) e il cron del backup non e' in vercel.json (su Vercel il disco e' a sola lettura): serve l'adattatore Blob/S3 (E24, E25, E15)."
    - "Backup: la chiave privata non e' ancora stata generata dal proprietario. Finche' BACKUP_PUBLIC_KEY non e' impostata i backup non partono. Il ripristino a mano su un ambiente vuoto va provato prima di caricare documenti reali."
    - "Backup: lo snapshot delle tabelle e' costruito in memoria (ok per uso personale, i file invece passano a flusso). Con testo estratto molto grande valutare lettura a cursore."
    - "dev-db: eseguire script (backup:run, db:migrate) mentre l'app e' aperta puo' bloccare il socket di PGlite (accade se uno script fallisce a meta'): riavviare pnpm dev:db."
    - "Documenti: manca l'adattatore Vercel Blob (E15). Il disco locale non funziona su Vercel: da fare prima del deploy."
    - "Documenti: nessuna anteprima incorporata (X-Frame-Options DENY, E19); nessuna schermata per modificare le categorie (E16); OCR spento (D6); hook antivirus non implementato."
    - "Documenti: il caricamento e il testo estratto dei PDF avvengono nella richiesta (timeout di estrazione 20 s). Con molti file grossi valutare un'elaborazione in background."
    - "e2e/documents.spec.ts importa tests/helpers/sample-pdf.ts (fuori da e2e/)."
    - "Schema auth generato usa timestamp senza fuso orario; Drizzle li gestisce in UTC. Valutare timestamptz se si personalizza."
    - "Email degli avvisi: adattatore Resend scritto ma mai provato con un account reale; senza RESEND_API_KEY gli avvisi restano solo nell'app."
    - "Link di condivisione a scadenza (D7): NON fatto, resta rimandato (solo pacchetti ZIP)."
    - "Il titolo delle scadenze create dalle voci (rate, canoni, tributi...) e' una fotografia al momento della creazione: se si rinomina la voce, la scadenza collegata si modifica da Scadenze."
    - "Tributi, manutenzioni, assicurazioni, locazioni: le voci tolte si cancellano davvero (non c'e' un cestino); la traccia resta solo nell'audit (azione e identificativo)."
    - "Menu dei documenti: mostrano i 1000 piu' recenti non archiviati (PICKER_LIMIT). Oltre non c'e' una ricerca nel menu: valutare un selettore con ricerca se l'archivio supera quella soglia."
    - "Locazioni: gli ospiti delle locazioni brevi non si registrano (nessun dato personale di terzi non necessario); registri o comunicazioni richiesti dal territorio si descrivono con le Regole e gli adempimenti."
    - "Regole: nessuna regola di esempio per le locazioni (cambierebbe i conteggi dei test e va scritta con un professionista); il fatto letting.types e' pronto nell'editor."
    - "Test e2e: gli indirizzi x-real-ip distinti per file vanno da 10 a 240; il prossimo libero e' 385 (usati fino a 381). Gli e2e usano e2e/support/pg-client.ts (Client con tentativi) al posto di pg. e2e/audit-log.spec.ts aggiunge righe al registro (append-only, non si tolgono): il database degli e2e e' in memoria."
    - "Calendario .ics: e' un file scaricato, non un abbonamento (non si aggiorna da solo) e contiene titoli e nomi degli immobili. Un abbonamento con URL a token richiederebbe un segreto in un indirizzo: non fatto senza decisione (E55)."
    - "Ricerca globale: i dati strutturati si filtrano in memoria (accenti e maiuscole): va bene per centinaia di righe di un solo proprietario; con volumi molto maggiori valutare un indice (unaccent / pg_trgm)."
    - "Registro delle modifiche: la verifica ricalcola tutta la catena a ogni richiesta (solo su 'Verifica ora'); con centinaia di migliaia di righe valutare una verifica incrementale. La rimozione delle ultime righe resta rilevabile solo col confronto con l'impronta dei backup."
