registro_codebase:
  ultimo_aggiornamento: "2026-10-06 (seconda tornata con agenti: sicurezza dell'account, caricamento multiplo, indici, doctor e log, tema e icone, porte di qualita', documentazione verificata, revisione di sicurezza; prima: pulizia del codice e funzionalita' di un progetto professionale: pagine di errore, CSV condiviso, quadro economico, da controllare, ricerca globale, calendario .ics, registro delle modifiche, /api/health, manuale operativo, Dependabot e audit delle dipendenze)"
  ultima_pulizia: "2026-10-06 (/cleanup eseguita su approvazione dell'utente: simboli e chiavi di messaggio mai usati, nessun file eliminato; nessun file temporaneo nel progetto)"

  moduli_esistenti:
    # Piattaforma (incremento 0) e moduli di business dell'incremento 1 (territory, directory, assets).
    - nome: "platform/audit"
      file: "app/src/platform/audit/index.ts"
      responsabilita: "Registro di audit append-only con catena di hash; verifica di integrita'; letture per il visualizzatore (righe a pagine, aree, ultima riga con impronta)"
      funzioni_chiave: ["createAuditRecorder", "verifyAuditChain", "listAuditEntries", "listAuditAreas", "auditHead"]
    - nome: "platform/db"
      file: "app/src/platform/db/"
      responsabilita: "Connessione Postgres (pool su globalThis), tipo Db comune ai driver, unita' di lavoro con audit, schema Drizzle"
      funzioni_chiave: ["getDb", "runInUnitOfWork", "schema/audit.ts (auditLog)", "schema/auth.ts (GENERATO da Better Auth)"]
    - nome: "platform/auth"
      file: "app/src/platform/auth/"
      responsabilita: "Account unico del proprietario: Better Auth (passkey + TOTP + password di riserva), bootstrap con token, controllo sessione"
      funzioni_chiave: ["getAuth", "bootstrapOwner", "ownerExists", "tokensMatch", "requireOwner", "getOwnerSession", "getOwnerSetup"]
    - nome: "platform/config"
      file: "app/src/platform/config/env.ts"
      responsabilita: "Validazione lazy delle variabili d'ambiente (Zod); negli errori solo i nomi, mai i valori"
      funzioni_chiave: ["getServerEnv", "getAuthEnv"]
    - nome: "platform/clock"
      file: "app/src/platform/clock/index.ts"
      responsabilita: "Tempo iniettato per dominio e scadenze deterministici"
      funzioni_chiave: ["ClockPort", "systemClock", "fixedClock"]
    - nome: "app (shell, accesso, sicurezza)"
      file: "app/src/app/"
      responsabilita: "Route Next.js: area protetta (sidebar in italiano, panoramica), accesso, configurazione iniziale, configurazione sicurezza, handler /api/auth"
      funzioni_chiave: ["(app)/layout.tsx", "(auth)/accesso", "(auth)/configurazione-iniziale", "(auth)/sicurezza/configurazione", "api/auth/[...all]/route.ts"]
    - nome: "proxy + i18n"
      file: "app/src/proxy.ts, app/src/i18n/request.ts, app/messages/it.json"
      responsabilita: "CSP con nonce per richiesta; stringhe dell'interfaccia esternalizzate (solo italiano), chiavi tipizzate"
      funzioni_chiave: ["proxy", "getRequestConfig"]
    - nome: "database: oggetti SQL"
      file: "app/drizzle/0001_audit_chain.sql, 0003_single_owner.sql"
      responsabilita: "Trigger e funzioni dell'audit (catena di hash, append-only, verifica); indice che limita la tabella user a una riga"
      funzioni_chiave: ["audit_log_compute_hash", "audit_log_before_insert", "audit_log_reject_change", "audit_log_verify", "user_single_owner"]

    - nome: "modules/territory"
      file: "app/src/modules/territory/"
      responsabilita: "Gerarchia Stato>Regione>Provincia>Comune>Localita' a dati; import ISTAT; ricerca con etichette"
      funzioni_chiave: ["createTerritory", "importIstat", "searchTerritories", "describeTerritories", "countTerritories", "parseIstatCsv"]
    - nome: "modules/directory"
      file: "app/src/modules/directory/"
      responsabilita: "Rubrica di persone ed enti con piu' ruoli; contatto proprietario creato alla prima richiesta"
      funzioni_chiave: ["createParty", "updateParty", "setPartyArchived", "ensureOwnerParty", "listParties"]
    - nome: "modules/assets"
      file: "app/src/modules/assets/"
      responsabilita: "Immobili e pertinenze (stesso record): titolarita' con quote, catasto a storico, collegamenti dichiarati"
      funzioni_chiave: ["createAsset", "updateAsset", "setAssetArchived", "listAssets", "getAssetDetail", "quotasExceedWhole", "parseEuroToCents"]
    - nome: "UI registro"
      file: "app/src/app/(app)/{immobili,rubrica,impostazioni}, app/src/components/{territory-picker,form-field}.tsx, app/src/app/api/territori"
      responsabilita: "Elenchi, moduli, schede; selettore di territori accessibile; ricerca protetta da sessione"
      funzioni_chiave: ["AssetForm", "PartyForm", "TerritoryForm", "TerritoryPicker", "Field"]
    - nome: "platform/storage"
      file: "app/src/platform/storage/"
      responsabilita: "StoragePort per i byte dei file (put/get/delete) con adattatore su disco locale (STORAGE_DIR, .storage/); chiavi validate. Adattatore Vercel Blob NON ancora scritto (D3)"
      funzioni_chiave: ["getStorage", "LocalFileStorage", "assertSafeKey", "StoragePort"]
    - nome: "modules/documents"
      file: "app/src/modules/documents/ (+ client.ts: costanti per i componenti client)"
      responsabilita: "Documenti con versioni, categorie a dati, collegamento ai beni, riconoscimento del tipo dai byte, testo dei PDF e ricerca FTS italiano, avviso duplicati, apertura autenticata dei file"
      funzioni_chiave: ["createDocument", "addDocumentVersion", "updateDocument", "setDocumentArchived", "listDocuments", "getDocumentDetail", "listDocumentCategories", "openDocumentFile", "sniffFile", "pdfTextExtractor"]
    - nome: "UI documenti"
      file: "app/src/app/(app)/documenti/, app/src/app/api/documenti/[id]/[versionId]/route.ts, scheda immobile (card Documenti)"
      responsabilita: "Elenco con ricerca e filtri, caricamento, scheda con versioni, modifica, nuova versione, archivio; route del file con sessione (401 senza)"
      funzioni_chiave: ["DocumentForm", "saveDocumentAction", "addVersionAction", "archiveDocumentAction", "loadDocumentFormOptions", "GET /api/documenti/[id]/[versionId]"]
    - nome: "database: documenti (migrazione 0005)"
      file: "app/drizzle/0005_documents.sql, app/src/platform/db/schema/documents.ts"
      responsabilita: "document_category (12 categorie generiche come dati), file_object, document, document_version (search_vector generato, GIN), document_asset"
      funzioni_chiave: ["document", "document_version", "file_object", "document_category", "document_asset"]
    - nome: "modules/backup"
      file: "app/src/modules/backup/"
      responsabilita: "Backup cifrato con chiave pubblica, esportazione completa in chiaro senza credenziali, storico dei backup, ripristino verificato su ambiente vuoto"
      funzioni_chiave: ["runBackup", "createExport", "restoreFromArchive", "listBackupRuns", "currentAuditHead", "backupSettingsFromEnv", "createArchive", "performBackup", "restoreArchive", "postgresSnapshotReader", "postgresRestoreTarget", "LocalBackupDestination"]
    - nome: "shared/archive"
      file: "app/src/shared/archive/{zip,crypto,stream}.ts"
      responsabilita: "ZIP in streaming (scrittura e lettura, rifiuta percorsi pericolosi), cifratura a blocchi AES-256-GCM con chiave dati avvolta in RSA-OAEP, conversioni tra generatori e flussi web"
      funzioni_chiave: ["zipStream", "unzipStream", "encryptStream", "decryptStream", "generateBackupKeyPair", "toWebStream", "fromWebStream"]
    - nome: "UI e route backup"
      file: "app/src/app/(app)/impostazioni/backup/, app/src/app/api/{backup/[id],esportazione,cron/backup}/route.ts, app/scripts/backup-{keygen,run,restore}.ts"
      responsabilita: "Pagina Backup ed esportazione; download del backup (cifrato) e dell'esportazione con sessione; cron protetto da CRON_SECRET; script per chiavi, backup a mano e ripristino"
      funzioni_chiave: ["BackupPage", "runBackupAction", "RunBackupButton", "pnpm backup:keygen", "pnpm backup:run", "pnpm backup:restore"]
    - nome: "database: backup (migrazione 0006)"
      file: "app/drizzle/0006_backup.sql, app/src/platform/db/schema/backup.ts"
      responsabilita: "backup_run: storico dei backup con esito, dimensione, impronta e hash di testa dell'audit"
      funzioni_chiave: ["backup_run"]
    - nome: "modules/rules"
      file: "app/src/modules/rules/ (+ client.ts: costanti e funzioni pure per i componenti client)"
      responsabilita: "Regole versionate come dati (versioni immutabili), condizioni validate, motore puro di valutazione con spiegazione, regole di esempio"
      funzioni_chiave: ["createRule", "addRuleVersion", "cloneRule", "setVersionVerification", "setRuleActive", "seedExampleRules", "listRules", "getRule", "loadActiveRules", "evaluateRules", "evaluateCondition", "effectiveVersion", "toFlat/fromFlat", "exampleRules"]
    - nome: "modules/dossier"
      file: "app/src/modules/dossier/ (+ client.ts)"
      responsabilita: "Voci del dossier di ogni bene (manuali o derivate), stato/nota/documenti solo del proprietario, valutazione che non sovrascrive mai le scelte, voci 'da rivedere', riepilogo per stato"
      funzioni_chiave: ["evaluateDossier", "evaluateAllDossiers", "getDossier", "addManualItem", "setItemStatus", "setItemNote", "removeManualItem", "linkDocument", "unlinkDocument", "listDossierCategories", "listLinkableDocuments"]
    - nome: "UI regole e dossier"
      file: "app/src/app/(app)/regole/, app/src/app/(app)/immobili/[id]/dossier/"
      responsabilita: "Elenco, modulo a campi (condizioni ed esiti), dettaglio, storico, confronto tra versioni, verifica, clonazione, disattivazione, regole di esempio; dossier con spiegazione 'perche' compare', collegamento documenti, note, voci manuali, stampa"
      funzioni_chiave: ["RuleForm", "ConditionText", "TraceText", "useFactLabels", "OutcomeList", "saveRuleAction", "seedRulesAction", "evaluateAction", "StatusSelect", "LinkDocument", "NoteForm", "formToPayload/versionToForm"]
    - nome: "caratteristiche tecniche dei beni"
      file: "app/src/modules/assets (attributes), app/src/app/(app)/immobili/_components/asset-form.tsx"
      responsabilita: "Attributi tipizzati del bene (testo, numero, si/no) modificabili dal modulo: sono i fatti delle regole"
      funzioni_chiave: ["attributeSchema", "AttributeFields", "ATTRIBUTE_TYPES"]
    - nome: "database: regole e dossier (migrazione 0007)"
      file: "app/drizzle/0007_rules_dossier.sql, app/src/platform/db/schema/rules.ts"
      responsabilita: "rule, rule_version (trigger rule_version_guard: immutabile e non cancellabile), dossier_category (13 categorie come dati), dossier_item, dossier_item_document"
      funzioni_chiave: ["rule_version_guard", "dossier_item_rule_uq"]
    - nome: "dev-db"
      file: "app/scripts/dev-db.ts"
      responsabilita: "Database di sviluppo locale persistente (PGlite su disco in app/.pglite, socket 54320) finche' non c'e' un branch Neon"
      funzioni_chiave: ["pnpm dev:db"]

    # --- Incrementi 5-12 (2026-10-05 / 2026-10-06) -------------------------------------------------------------------
    - nome: "modules/deadlines"
      file: "app/src/modules/deadlines/ (+ client.ts)"
      responsabilita: "Scadenze con calcolo relativo a un'ancora (annuale fissa, relativa, ricorrente, manuale), spostamento al giorno lavorativo con festivi a dati, date (occurrences) generate in un orizzonte, prove di chiusura, avvisi in-app, outbox email idempotente, escalation dei ritardi, impostazioni di notifica"
      funzioni_chiave: ["createDeadline", "updateDeadline", "setDeadlineArchived", "syncDerivedDeadlines", "completeOccurrence", "completeOpenOccurrences", "reopenOccurrence", "snoozeOccurrence", "addProof", "runDailyCycle", "listOccurrences", "getDeadlineDetail", "listDeadlines", "deadlineSummary", "listNotifications", "saveNotificationSettings", "noMail", "resendMail"]
    - nome: "giro giornaliero"
      file: "app/src/lib/daily-job.ts, app/src/app/api/cron/giornaliero/route.ts, app/vercel.json"
      responsabilita: "Rivaluta tutti i dossier e allinea scadenze e avvisi; chiamato dal cron (CRON_SECRET, confronto a tempo costante) e dal pulsante in Impostazioni > Notifiche. vercel.json lo pianifica alle 05:00 UTC (NON verificato su Vercel)"
      funzioni_chiave: ["runDailyJob", "GET /api/cron/giornaliero"]
    - nome: "modules/matters"
      file: "app/src/modules/matters/"
      responsabilita: "Pratiche con contatti assegnati (dalla rubrica), richieste di documenti, pareri 'informativi' o 'validati formalmente' come li indica il proprietario, documenti collegati"
      funzioni_chiave: ["createMatter", "updateMatter", "assignParty", "unassignParty", "addRequest", "resolveRequest", "addOpinion", "linkMatterDocument", "listMatters", "getMatterDetail"]
    - nome: "modules/sharing"
      file: "app/src/modules/sharing/ (+ shared/archive)"
      responsabilita: "Pacchetti ZIP per un destinatario: snapshot memorizzato (jsonb) e servito identico, file con impronta verificata in streaming, tetto di riservatezza con consenso esplicito per documento, registro delle condivisioni, revoca (410). Il link a scadenza (D7) NON c'e'"
      funzioni_chiave: ["buildPackage", "createPackage", "revokePackage", "listPackages", "getPackageDetail", "streamPackage", "verifiedStream"]
    - nome: "modules/condominium"
      file: "app/src/modules/condominium/"
      responsabilita: "Condominio: immobili (uno solo per immobile), tabelle millesimali (millesimi interi x10000), esercizi con preventivi e rate ripartite a resto maggiore, assemblee con ordine del giorno, deleghe e delibere (soglia scritta dal proprietario, confronto neutro), lavori, sinistri, contratti"
      funzioni_chiave: ["createCondominium", "addMember", "createTable", "saveShares", "createFiscalYear", "createBudget", "generateInstallments", "recordPayment", "createMeeting", "addAgendaItem", "addResolution", "createResolutionDeadline", "createWork", "createClaim", "getCondominiumDetail", "getMeetingDetail", "allocateByShares", "checkVotes", "parseMilli"]
    - nome: "modules/taxes"
      file: "app/src/modules/taxes/"
      responsabilita: "Tributi e pagamenti: tipi scritti dal proprietario, voci per bene/tipo/anno con importo indicato a mano, pagamenti con prova, chiusura con motivo, dichiarazioni, riepilogo per il consulente e CSV. Nessuna aliquota, nessun calcolo di imposta"
      funzioni_chiave: ["createTaxType", "createObligation", "recordPayment", "removePayment", "closeObligation", "reopenObligation", "createReturn", "updateReturn", "listObligations", "adviserSummary", "summaryCsv", "obligationState", "summarize", "csvCell"]
    - nome: "modules/maintenance"
      file: "app/src/modules/maintenance/"
      responsabilita: "Manutenzioni e lavori: interventi con preventivi (accettare porta ad 'approvato', mai indietro), avanzamenti con percentuale facoltativa, fatture pagate/da pagare, garanzie, piani di ispezione = scadenze ricorrenti ancorate alla prima data"
      funzioni_chiave: ["createWork", "setWorkStatus", "addQuote", "setQuoteStatus", "addInvoice", "setInvoicePaid", "addProgress", "removeEntry", "createWarranty", "createInspectionPlan", "listWorks", "getWorkDetail", "listWarranties", "listInspectionPlans", "workFinancials"]
    - nome: "modules/insurance"
      file: "app/src/modules/insurance/"
      responsabilita: "Assicurazioni: polizze (piu' immobili), garanzie copiate a mano, premi con scadenza e ricevuta, sinistri e comunicazioni. Non interpreta le condizioni ne' dice se un evento e' coperto"
      funzioni_chiave: ["createPolicy", "setPolicyArchived", "createPolicyDeadline", "addCoverage", "addPremium", "setPremiumPaid", "createClaim", "setClaimStatus", "addClaimEntry", "listPolicies", "getPolicyDetail", "listClaims", "getClaimDetail"]
    - nome: "modules/lettings"
      file: "app/src/modules/lettings/ (+ client.ts)"
      responsabilita: "Locazioni e ricettivita': tipo reale scelto per primo (abitativa, transitoria, studenti, breve/turistica, struttura ricettiva), contratto e cauzione solo per le locazioni di durata, persone dalla rubrica, calendario dei canoni, codici identificativi, adempimenti (comunicazioni, imposta di soggiorno, statistiche). I requisiti per territorio sono REGOLE: il tipo in corso e' il fatto letting.types"
      funzioni_chiave: ["createLetting", "setLettingStatus", "addLettingParty", "generateRentSchedule", "recordRentPayment", "addCode", "addReport", "markReportDone", "reopenReport", "listLettings", "getLettingDetail", "activeLettingTypes", "rentDates", "rentState"]
    - nome: "UI dei moduli 5-10"
      file: "app/src/app/(app)/{scadenze,avvisi,pratiche,condivisione,condominio,tributi,manutenzioni,assicurazioni,locazioni}/ + impostazioni/notifiche"
      responsabilita: "Elenchi, moduli a campi (SimpleForm), piccoli moduli nella pagina (InlineForm), azioni del server con ownerAction, sezioni con ?sezione=, scheda con pagamenti/prove, riepiloghi stampabili e CSV (api/tributi/riepilogo)"
      funzioni_chiave: ["SimpleForm", "InlineForm", "ActionButton", "PrintButton", "ownerAction", "ownerActionWithValue"]
    - nome: "limiti dell'assistenza"
      file: "app/src/app/(app)/limiti/page.tsx, app/src/app/(app)/_components/app-sidebar.tsx"
      responsabilita: "Pagina 'Cosa fa e cosa non fa l'app' (sezione 12 della specifica): cosa non dichiara mai, quando serve un professionista, come leggere le formule neutre, limiti per area. Collegamento sempre visibile nella barra laterale e nella panoramica"
      funzioni_chiave: ["LimitsPage", "disclaimer.link"]
    - nome: "database: migrazioni 0008-0013"
      file: "app/drizzle/0008_deadlines.sql ... 0013_lettings.sql, app/src/platform/db/schema/{deadlines,matters,condominium,taxes,maintenance,insurance,lettings}.ts"
      responsabilita: "Scadenze (11 regole dei festivi come dati), pratiche e condivisione, condominio, tributi, manutenzioni, assicurazioni, locazioni; tutte le tabelle nell'archivio del backup"
      funzioni_chiave: ["holiday_rule", "deadline", "deadline_occurrence", "notification", "share_package", "condominium", "tax_obligation", "maint_work", "ins_policy", "letting"]

    - nome: "modules/economy"
      file: "app/src/modules/economy/ (domain/economy.ts, application/use-cases.ts, index.ts)"
      responsabilita: "Quadro economico, sola lettura: somma per anno e immobile i pagamenti e gli incassi registrati in tributi, assicurazioni, manutenzioni, condominio, locazioni (letture *Ledger dei moduli). Non ripartisce mai: le voci non attribuibili vanno in 'Non ripartito'. CSV con csvDocument"
      funzioni_chiave: ["getEconomy", "economyYears", "economyCsv", "COST_AREAS", "INCOME_AREAS"]
    - nome: "modules/attention"
      file: "app/src/modules/attention/ (domain/findings.ts, index.ts)"
      responsabilita: "'Da controllare', sola lettura: fatti ricavati dai dati degli altri moduli (scadenze, documenti, tributi, condominio, manutenzioni, assicurazioni, locazioni, dossier, backup) con gravita' alta/normale e rimando alla scheda. Linguaggio neutro: nessun verdetto"
      funzioni_chiave: ["gatherSources", "computeFindings", "countBySeverity", "ATTENTION_AREAS", "SOON_DAYS"]
    - nome: "modules/search"
      file: "app/src/modules/search/ (domain/search.ts, index.ts)"
      responsabilita: "Ricerca globale, sola lettura, senza schema ne' log delle ricerche: 11 gruppi (immobili, documenti, rubrica, scadenze, tributi, condominio, manutenzioni, assicurazioni, locazioni, pratiche, regole); insensibile a maiuscole e accenti, tutte le parole devono comparire; 8 risultati per gruppo con totale vero"
      funzioni_chiave: ["searchAll", "cleanQuery", "matchesAll", "normalize", "limitGroup", "SEARCH_GROUPS", "MIN_QUERY", "PER_GROUP"]
    - nome: "letture dei movimenti (ledger)"
      file: "app/src/modules/{taxes,insurance,maintenance,condominium,lettings}/ (application/use-cases.ts, ports, repository, index.ts)"
      responsabilita: "Una lettura per modulo che elenca i movimenti con data, importo, immobile ed etichetta, per il quadro economico; il modulo economy non entra mai nelle tabelle degli altri"
      funzioni_chiave: ["taxLedger", "insuranceLedger", "maintenanceLedger", "condominiumLedger", "lettingLedger"]
    - nome: "UI di economia, controlli, ricerca, registro, calendario, salute"
      file: "app/src/app/(app)/{economia,controlli,cerca,impostazioni/registro}/, app/src/app/api/{economia,calendario,health}/route.ts, app/src/app/(app)/layout.tsx (casella di ricerca), app/src/app/(app)/page.tsx (scheda 'Da controllare')"
      responsabilita: "Quadro economico (stampa e CSV), 'Da controllare', pagina di ricerca e casella nell'intestazione, registro delle modifiche con verifica della catena, calendario .ics delle scadenze aperte (sessione obbligatoria), controllo di salute pubblico (solo select 1)"
      funzioni_chiave: ["EconomyPage", "AttentionPage", "AttentionList", "SearchPage", "AuditLogPage", "GET /api/economia", "GET /api/calendario", "GET /api/health"]
    - nome: "calendario delle scadenze (.ics)"
      file: "app/src/modules/deadlines/application/calendar.ts, app/src/modules/deadlines/index.ts (deadlinesCalendar), app/src/shared/ics.ts"
      responsabilita: "Scadenze aperte e non archiviate come eventi di un giorno intero con UID stabile, categoria, immobile, link e un promemoria alle 9:00 per ogni preavviso. Il costruttore e' generico (nessun legame con le scadenze)"
      funzioni_chiave: ["deadlinesCalendar", "openDeadlinesCalendar", "calendarEvents", "buildIcs", "icsText", "foldLine", "alarmTrigger"]
    - nome: "pagine di errore e non trovato"
      file: "app/src/components/not-found-card.tsx, app/src/app/not-found.tsx, app/src/app/(app)/not-found.tsx, app/src/app/(app)/error.tsx, app/src/app/global-error.tsx"
      responsabilita: "404 e errori imprevisti con testo neutro; l'errore mostra solo il codice digest, mai il messaggio. Nessun loading.tsx a livello (app): trasformerebbe i 404 in 200"
      funzioni_chiave: ["NotFoundCard", "AppError", "GlobalError"]
    - nome: "operativita' (manuale, Dependabot, controllo dipendenze)"
      file: "docs/RUNBOOK.md, .github/dependabot.yml, .github/workflows/{ci,security}.yml, app/package.json (pnpm.auditConfig)"
      responsabilita: "Manuale operativo (routine, backup e ripristino, migrazioni, segreti, accesso perso, registro, sintomi) con cio' che e' provato e non; aggiornamenti settimanali raggruppati; audit settimanale delle dipendenze di produzione con una sola esclusione motivata"
      funzioni_chiave: ["RUNBOOK.md", "dependabot.yml", "security.yml"]

    - nome: "sicurezza dell'account"
      file: "app/src/platform/auth/account-security.ts, app/src/shared/account-security.ts, app/src/app/(app)/impostazioni/sicurezza/*, app/src/components/passkey-add-form.tsx, hooks in app/src/platform/auth/auth.ts"
      responsabilita: "Passkey (elenco, rinomina, rimozione mai dell'ultima, aggiunta), sessioni attive e revoca, codici di recupero, cambio password; audit di soli nomi e conteggi; rotte delete/update-passkey di Better Auth chiuse (403)"
      funzioni_chiave: ["listPasskeys", "removePasskey", "renamePasskey", "listActiveSessions", "revokeSession", "revokeOtherSessions", "canRemovePasskey", "describeUserAgent", "maskIpAddress"]
    - nome: "caricamento multiplo di documenti"
      file: "app/src/app/(app)/documenti/carica-piu/*, app/src/modules/documents (findDocumentsWithSameFile)"
      responsabilita: "Fino a 20 file per lotto, un'azione per file, esito per file, controllo sha256 prima dell'invio, titolo dal nome del file"
      funzioni_chiave: ["uploadOneDocumentAction", "BulkUploadForm", "titleFromFilename", "findDocumentsWithSameFile"]
    - nome: "platform/doctor e platform/logging"
      file: "app/src/platform/doctor/checks.ts, app/scripts/doctor.ts, app/src/platform/logging/request-error.ts, app/src/instrumentation.ts"
      responsabilita: "pnpm doctor (esiti ok/avviso/errore, uscita 1 con errori); riga JSON per errore del server con soli campi in lista bianca"
