name: Sicurezza delle dipendenze

# Controllo settimanale (e a richiesta) delle vulnerabilita' note nelle dipendenze di produzione. Resta fuori dalla CI di ogni
# modifica: un avviso nuovo su un pacchetto che non abbiamo toccato non deve bloccare un lavoro che non c'entra.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  audit:
    name: pnpm audit (produzione)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilita' note (gravita' alta o critica)
        run: pnpm audit --prod --audit-level high
