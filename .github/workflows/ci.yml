name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Tipi, lint, confini, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Stessa major di Neon. Il nome del database contiene "test": i test rifiutano altri nomi.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestione_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Tipi
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Confini tra moduli
        run: pnpm arch

      - name: Migrazioni allineate allo schema
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Lo schema Drizzle e' cambiato senza una migrazione. Esegui 'pnpm db:generate' e committa i file."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Test (PGlite in-process)
        run: pnpm test
      - name: Test (Postgres reale)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gestione_test

      - name: Copertura dei test (soglie in vitest.config.mts)
        run: pnpm test:coverage
      - name: Report di copertura
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

      # Codice morto: file, export e dipendenze inutilizzati (i tipi dei barrel sono solo avvisi, vedi knip.json).
      - name: Codice morto (knip)
        run: pnpm knip

  e2e:
    name: End-to-end (build di produzione)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
